<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">


        <title>Bridges - My Favorites</title>

        <!-- Ali: Style this page using CSS and Bootstrap -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel = "stylesheet" href = "css/style.css">


        <!-- Gianny: Use the jQuery for searching and AJAX -->

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"> </script>

    </head>

    <body>

        <!-- Ill handle navigation between the pages -->

        <header id="favoritesHeader">
            <h2>Bridges</h2>

            <nav>
                <a href="index.html">Home</a>
                <a href="signupPage.html">Join Bridges</a>
                <a href="pageForPosts.html">Manage Posts</a>
                <a href="pageForFavorites.html">My Favorites</a>
                
            </nav>
        </header>


        <main id="pageForFavorites" class ="container my-4">


            <!-- Ali: Style the introduction section -->
             <section id="favoritesIntro">

                <h1>My Favorite Resources</h1>
                <p>Save and manage your resources</p>
             </section>


             <!-- Gianny: Use jQuery to search available resources -->
              <section id="resourceSearch" class="my-4">

                <h2>Find Resources</h2>



                <input type ="text" id="searchResource" placeholder="Search by title or category">

                <button type="button" id ="searchResourceButton">
                    Search
                </button>


                <!-- Gianny: Display matching resources here -->
                <!-- Mahmoud: Add an add to favorites button to each resource -->
                 <div id="resourceResults">

                 </div>
              </section>

              <!-- Mahmoud: Validate the saved resource form -->
               <section id ="favoriteFormBox" class ="my-4">
                <h2>Edit Favorite</h2>

                <form id ="favoriteForm">


                    <div>
                        <label for="favoriteId">Resource ID</label>
                        <input type ="number" id="favoriteId" required>

                    </div>

                    <div>

                        <label for="favoriteNotes">Personal Notes</label>
                        <textarea id="favoriteNotes"></textarea>
                    </div>


                    <button type ="submit">Update Favorite</button>
                    
                </form>

                <p id ="favoriteMessage"></p>
                <button type="button" id="sendFavorites">Send Favorites to Server</button>
                <p id="ajaxMessage"></p>


               </section>

               <!-- Ali: Style saved resources using bootstrap cards -->
                <section id="savedFavorites" class ="my-4">
                    <h2>Saved Resources</h2>


                    <!-- Mahmoud: Display and remove saved resources -->

                    <!-- Gianny: Connect the resource dara with jQuery -->
                    <div id="favoritesList"></div>
                </section>



        </main>

        <!-- Mahmoud and gianny: JS, jQuery, AJAX -->
        <script src="js/favorites.js"></script>
        

        
    </body>


























</html>
